mode = "streamlit"

[settings]
visrag_retriever_backend = "huggingface"
visrag_embedding_provider = "huggingface"
visrag_embedding_model = "sentence-transformers/all-MiniLM-L6-v2"
visrag_embedding_base_url = ""

[reasoning_model]
provider = "huggingface"
model = "mistralai/Mistral-7B-Instruct-v0.3"

[spec_model]
provider = "huggingface"
model = "mistralai/Mistral-7B-Instruct-v0.3"

[vlm_model]
provider = "openai"
model = "gpt-4.1-mini"

[vision_judge_model]
provider = "openai"
model = "gpt-4.1-mini"
