mode = "streamlit"

[settings]
gpu_ram_gb = 8.0
visrag_enabled = true
artifact_root = "./artifacts/local_test/local_test_qwen2_5_coder_7b_safe"
analytics_tail_enabled = false
enable_evaluation_summary = false
spec_generation_max_attempts = 20
spec_generation_response_parse_retries = 20
semantic_feedback_loop_enabled = true
semantic_feedback_max_attempts = 20
semantic_feedback_mode = "strict"
semantic_feedback_min_accept_confidence = 0.75
semantic_feedback_save_rejected_specs = true
semantic_feedback_corpus_path = "./rag_corpus/feedback/visual_feedback_local_test.jsonl"

[reasoning_model]
provider = "ollama"
model = "qwen2.5-coder:7b"
base_url = "http://localhost:11434"
temperature = 0.0
timeout_seconds = 180.0
num_ctx = 4096
max_output_tokens = 1000

[spec_model]
provider = "ollama"
model = "qwen2.5-coder:7b"
base_url = "http://localhost:11434"
temperature = 0.0
timeout_seconds = 180.0
num_ctx = 4096
max_output_tokens = 1000

[vlm_model]
provider = "ollama"
model = "gemma3:4b"
base_url = "http://localhost:11434"
temperature = 0.0
timeout_seconds = 180.0
num_ctx = 4096
