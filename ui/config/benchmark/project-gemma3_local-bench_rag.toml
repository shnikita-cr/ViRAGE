mode = "streamlit"

[settings]
visrag_retrieval_backend = "hybrid"
visrag_top_k_chunks = 8
visrag_hybrid_method = "cc"
visrag_hybrid_weight = 0.1
visrag_hybrid_rrf_k = 60.0
visrag_candidate_pool_size = 64
visrag_embedding_provider = "ollama"
visrag_embedding_model = "nomic-embed-text:latest"
visrag_embedding_base_url = "http://localhost:11434"
analytics_tail_enabled = false
semantic_feedback_corpus_path = "./rag_corpus/feedback/visual_feedback_gemma3_12b.jsonl"

[reasoning_model]
provider = "ollama"
model = "gemma3:12b"

[spec_model]
provider = "ollama"
model = "gemma3:12b"

[vlm_model]
provider = "ollama"
model = "gemma3:12b"

[vision_judge_model]
provider = "ollama"
model = "gemma3:12b"
