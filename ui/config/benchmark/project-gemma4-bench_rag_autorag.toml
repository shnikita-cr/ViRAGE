mode = "streamlit"

[settings]
visrag_retrieval_backend = "hybrid"
visrag_top_k_chunks = 8
visrag_hybrid_method = "cc"
visrag_hybrid_weight = 0.1
visrag_hybrid_rrf_k = 60.0
visrag_candidate_pool_size = 64
visrag_embedding_provider = "ollama"
visrag_embedding_model = "nomic-embed-text:latest"
visrag_embedding_base_url = "http://localhost:11434"
visrag_chroma_persist_dir = "./resources/chroma/virage_guidance_chunks_nomic_embed_text_latest"
visrag_chroma_collection_name = "virage_guidance_chunks_nomic_embed_text_latest"
analytics_tail_enabled = false
semantic_feedback_corpus_path = "./rag_corpus/feedback/visual_feedback_nlv.jsonl"

[reasoning_model]
provider = "ollama"
model = "gemma4:31b-cloud"

[spec_model]
provider = "ollama"
model = "gemma4:31b-cloud"

[vlm_model]
provider = "ollama"
model = "gemma4:31b-cloud"

[vision_judge_model]
provider = "ollama"
model = "gemma4:31b-cloud"
