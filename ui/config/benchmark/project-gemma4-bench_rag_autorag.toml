mode = "streamlit"

[settings]
# AutoRAG-selected NLV benchmark profile: BM25 with top_k=1 and no readability-rule noise.
visrag_top_k_chart_patterns = 1
visrag_top_k_readability_rules = 0
visrag_top_k_scale_plot_area_rules = 0
visrag_top_k_vlm_readability_rules = 0
visrag_top_k_domain_semantics_rules = 0
analytics_tail_enabled = false
semantic_feedback_corpus_path = "./rag_corpus/feedback/visual_feedback_nlv.jsonl"

[reasoning_model]
provider = "ollama"
model = "gemma4:31b-cloud"

[spec_model]
provider = "ollama"
model = "gemma4:31b-cloud"

[vlm_model]
provider = "ollama"
model = "gemma4:31b-cloud"

[vision_judge_model]
provider = "ollama"
model = "gemma4:31b-cloud"
