mode = "streamlit"

[settings]
visrag_enabled = false
artifact_root = "./artifacts-nlv-5b"
visrag_corpus_root = "./rag_corpus/data"
visrag_top_k_examples = 5
visrag_retriever_backend = "bm25"
visrag_embedding_provider = "ollama"
visrag_embedding_model = "nomic-embed-text"
visrag_embedding_base_url = "http://localhost:11434"
visrag_embedding_timeout_seconds = 60.0
vega_output_format = "png"
enable_scenegraph_check = true
enable_empty_chart_check = true
enable_spec_score = true
enable_vision_score = true
enable_evaluation_summary = true
strict_image_only_analysis = true
streamlit_compute_metrics = true
streamlit_show_step_logs = true
spec_generation_backend = "vegachat_codegen"
spec_generation_max_attempts = 3
spec_generation_response_parse_retries = 0
spec_generation_prompt_version = "vega_chat_v1"
spec_generation_include_visrag_context = true
spec_generation_max_context_chars = 3000
semantic_feedback_loop_enabled = true
semantic_feedback_max_attempts = 2
semantic_feedback_min_accept_confidence = 0.75
semantic_feedback_save_rejected_specs = true
semantic_feedback_corpus_path = "./rag_corpus/feedback/visual_feedback_nlv.jsonl"
semantic_feedback_include_png_path = true


[streamlit]
compute_metrics = true
show_step_logs = true

[reasoning_model]
provider = "ollama"
model = "gemma3:4b"
temperature = 0.0
base_url = "http://localhost:11434"
timeout_seconds = 60.0

[spec_model]
provider = "ollama"
model = "gemma3:4b"
temperature = 0.0
base_url = "http://localhost:11434"
timeout_seconds = 60.0

[vlm_model]
provider = "ollama"
model = "gemma3:4b"
temperature = 0.0
timeout_seconds = 60.0

[vision_judge_model]
provider = "ollama"
model = "gemma3:4b"
temperature = 0.0
timeout_seconds = 60.0
