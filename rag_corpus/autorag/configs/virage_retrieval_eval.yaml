# ViRAGE AutoRAG retrieval evaluation config.
# AutoRAG computes retrieval metrics and compares lexical, semantic and hybrid retrieval.

vectordb:
  - name: virage_chroma_bge_m3_latest
    db_type: chroma
    client_type: persistent
    embedding_batch: 1
    embedding_model:
      - type: ollama
        model_name: bge-m3:latest
        base_url: http://localhost:11434
    collection_name: virage_guidance_chunks_bge_m3_latest
    path: ${PROJECT_DIR}/resources/chroma/virage_guidance_chunks_bge_m3_latest

  - name: virage_chroma_mxbai_embed_large_latest
    db_type: chroma
    client_type: persistent
    embedding_batch: 1
    embedding_model:
      - type: ollama
        model_name: mxbai-embed-large:latest
        base_url: http://localhost:11434
    collection_name: virage_guidance_chunks_mxbai_embed_large_latest
    path: ${PROJECT_DIR}/resources/chroma/virage_guidance_chunks_mxbai_embed_large_latest

  - name: virage_chroma_nomic_embed_text_latest
    db_type: chroma
    client_type: persistent
    embedding_batch: 1
    embedding_model:
      - type: ollama
        model_name: nomic-embed-text:latest
        base_url: http://localhost:11434
    collection_name: virage_guidance_chunks_nomic_embed_text_latest
    path: ${PROJECT_DIR}/resources/chroma/virage_guidance_chunks_nomic_embed_text_latest

  - name: virage_chroma_qwen3_embedding_latest
    db_type: chroma
    client_type: persistent
    embedding_batch: 1
    embedding_model:
      - type: ollama
        model_name: qwen3-embedding:latest
        base_url: http://localhost:11434
    collection_name: virage_guidance_chunks_qwen3_embedding_latest
    path: ${PROJECT_DIR}/resources/chroma/virage_guidance_chunks_qwen3_embedding_latest

node_lines:
  - node_line_name: retrieve_node_line
    nodes:
      - node_type: lexical_retrieval
        strategy:
          metrics: [retrieval_f1, retrieval_recall, retrieval_precision]
          speed_threshold: 10
        top_k: [1, 3, 5, 8]
        modules:
          - module_type: bm25
            bm25_tokenizer: [porter_stemmer, space]

      - node_type: semantic_retrieval
        strategy:
          metrics: [retrieval_f1, retrieval_recall, retrieval_precision]
          speed_threshold: 30
        top_k: [1, 3, 5, 8]
        modules:
          - module_type: vectordb
            vectordb: virage_chroma_bge_m3_latest
          - module_type: vectordb
            vectordb: virage_chroma_mxbai_embed_large_latest
          - module_type: vectordb
            vectordb: virage_chroma_nomic_embed_text_latest
          - module_type: vectordb
            vectordb: virage_chroma_qwen3_embedding_latest

      - node_type: hybrid_retrieval
        strategy:
          metrics: [retrieval_f1, retrieval_recall, retrieval_precision]
          speed_threshold: 40
        top_k: [1, 3, 5, 8]
        modules:
          - module_type: hybrid_rrf
            weight_range: (4, 80)
          - module_type: hybrid_cc
            normalize_method: [mm, tmm, z, dbsf]
            weight_range: (0.0, 1.0)
            test_weight_size: 11
