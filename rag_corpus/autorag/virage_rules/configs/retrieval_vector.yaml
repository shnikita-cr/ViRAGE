# AutoRAG vector retrieval experiment placeholder for ViRAGE rule corpus.
node_lines:
  - node_line_name: retrieve_node_line
    nodes:
      - node_type: retrieval
        strategy:
          metrics: [retrieval_f1, retrieval_recall]
        modules:
          - module_type: vectordb
            top_k: [3, 5, 8]
