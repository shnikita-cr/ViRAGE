# AutoRAG Vega-Lite all-grid retrieval config.
#
# Why multiple node_lines instead of `top_k: [3, 5, 10, 20]`?
# AutoRAG documents `top_k` as a node-level parameter. Keeping top_k scalar
# inside each node_line is more compatible across AutoRAG versions while still
# keeping the whole experiment in one YAML file.
#
# This config compares:
#   - BM25 lexical retrieval with tokenizer variants
#   - semantic VectorDB retrieval
#   - hybrid RRF / CC retrieval
# across top_k = 3, 5, 10, 20.

node_lines:
  - node_line_name: retrieve_bm25_topk_03
    nodes:
      - node_type: lexical_retrieval
        strategy:
          metrics: [retrieval_f1, retrieval_recall, retrieval_precision, retrieval_ndcg, retrieval_mrr]
          speed_threshold: 10
        top_k: 3
        modules:
          - module_type: bm25
            bm25_tokenizer: [porter_stemmer, space]

  - node_line_name: retrieve_bm25_topk_05
    nodes:
      - node_type: lexical_retrieval
        strategy:
          metrics: [retrieval_f1, retrieval_recall, retrieval_precision, retrieval_ndcg, retrieval_mrr]
          speed_threshold: 10
        top_k: 5
        modules:
          - module_type: bm25
            bm25_tokenizer: [porter_stemmer, space]

  - node_line_name: retrieve_bm25_topk_10
    nodes:
      - node_type: lexical_retrieval
        strategy:
          metrics: [retrieval_f1, retrieval_recall, retrieval_precision, retrieval_ndcg, retrieval_mrr]
          speed_threshold: 10
        top_k: 10
        modules:
          - module_type: bm25
            bm25_tokenizer: [porter_stemmer, space]

  - node_line_name: retrieve_bm25_topk_20
    nodes:
      - node_type: lexical_retrieval
        strategy:
          metrics: [retrieval_f1, retrieval_recall, retrieval_precision, retrieval_ndcg, retrieval_mrr]
          speed_threshold: 10
        top_k: 20
        modules:
          - module_type: bm25
            bm25_tokenizer: [porter_stemmer, space]

  - node_line_name: retrieve_semantic_topk_03
    nodes:
      - node_type: semantic_retrieval
        strategy:
          metrics: [retrieval_f1, retrieval_recall, retrieval_precision, retrieval_ndcg, retrieval_mrr]
          speed_threshold: 30
        top_k: 3
        modules:
          - module_type: vectordb
            vectordb: default

  - node_line_name: retrieve_semantic_topk_05
    nodes:
      - node_type: semantic_retrieval
        strategy:
          metrics: [retrieval_f1, retrieval_recall, retrieval_precision, retrieval_ndcg, retrieval_mrr]
          speed_threshold: 30
        top_k: 5
        modules:
          - module_type: vectordb
            vectordb: default

  - node_line_name: retrieve_semantic_topk_10
    nodes:
      - node_type: semantic_retrieval
        strategy:
          metrics: [retrieval_f1, retrieval_recall, retrieval_precision, retrieval_ndcg, retrieval_mrr]
          speed_threshold: 30
        top_k: 10
        modules:
          - module_type: vectordb
            vectordb: default

  - node_line_name: retrieve_semantic_topk_20
    nodes:
      - node_type: semantic_retrieval
        strategy:
          metrics: [retrieval_f1, retrieval_recall, retrieval_precision, retrieval_ndcg, retrieval_mrr]
          speed_threshold: 30
        top_k: 20
        modules:
          - module_type: vectordb
            vectordb: default

  - node_line_name: retrieve_hybrid_topk_03
    nodes:
      - node_type: lexical_retrieval
        strategy:
          metrics: [retrieval_f1, retrieval_recall, retrieval_precision, retrieval_ndcg, retrieval_mrr]
          speed_threshold: 10
        top_k: 3
        modules:
          - module_type: bm25
            bm25_tokenizer: [porter_stemmer, space]
      - node_type: semantic_retrieval
        strategy:
          metrics: [retrieval_f1, retrieval_recall, retrieval_precision, retrieval_ndcg, retrieval_mrr]
          speed_threshold: 30
        top_k: 3
        modules:
          - module_type: vectordb
            vectordb: default
      - node_type: hybrid_retrieval
        strategy:
          metrics: [retrieval_f1, retrieval_recall, retrieval_precision, retrieval_ndcg, retrieval_mrr]
          speed_threshold: 30
        top_k: 3
        modules:
          - module_type: hybrid_rrf
            weight_range: (4, 80)
          - module_type: hybrid_cc
            normalize_method: [mm, z]
            weight_range: (0.0, 1.0)
            test_weight_size: 11

  - node_line_name: retrieve_hybrid_topk_05
