# Optional debug-only config. Use when semantic/vector/hybrid environment is not ready.
node_lines:
  - node_line_name: retrieve_bm25_debug_topk_05
    nodes:
      - node_type: lexical_retrieval
        strategy:
          metrics: [retrieval_f1, retrieval_recall, retrieval_precision, retrieval_ndcg, retrieval_mrr]
          speed_threshold: 10
        top_k: 5
        modules:
          - module_type: bm25
            bm25_tokenizer: [porter_stemmer, space]
