# Matrix for deterministic explicit AutoRAG retrieval grid.
# This file is not consumed by AutoRAG directly.
# It is consumed by rag_corpus/autorag/vega_lite/03_generate_explicit_all_grid.py
# and expanded into configs/01_retrieval_grid_all_explicit.yaml.

metrics:
  - retrieval_f1
  - retrieval_recall
  - retrieval_precision
  - retrieval_ndcg
  - retrieval_mrr

speed_threshold: 10

top_k_values:
  - 3
  - 5
  - 10
  - 20

bm25_tokenizers:
  - porter_stemmer
  - space

# Explicit local / no-OpenAI VectorDB profiles.
# AutoRAG docs allow embedding_model in the vectordb section.
vectordb_profiles:
  - name: chroma_hf_bge_small_en_v15
    db_type: chroma
    client_type: persistent
    embedding_batch: 16
    embedding_model:
      - type: huggingface
        model_name: BAAI/bge-small-en-v1.5
    collection_name: vega_lite_bge_small_en_v15
    path: rag_corpus/autorag/vega_lite/chroma/bge_small_en_v15

  - name: chroma_hf_all_minilm_l6_v2
    db_type: chroma
    client_type: persistent
    embedding_batch: 16
    embedding_model:
      - type: huggingface
        model_name: sentence-transformers/all-MiniLM-L6-v2
    collection_name: vega_lite_all_minilm_l6_v2
    path: rag_corpus/autorag/vega_lite/chroma/all_minilm_l6_v2

  - name: chroma_hf_all_mpnet_base_v2
    db_type: chroma
    client_type: persistent
    embedding_batch: 16
    embedding_model:
      - type: huggingface
        model_name: sentence-transformers/all-mpnet-base-v2
    collection_name: vega_lite_all_mpnet_base_v2
    path: rag_corpus/autorag/vega_lite/chroma/all_mpnet_base_v2

hybrid_modules:
  - module_type: hybrid_rrf
    weight_range: "(10, 80)"

  - module_type: hybrid_cc
    normalize_method:
      - mm
      - z
    weight_range: "(0.0, 1.0)"
    test_weight_size: 11

include:
  bm25: true
  semantic: true
  hybrid: true
