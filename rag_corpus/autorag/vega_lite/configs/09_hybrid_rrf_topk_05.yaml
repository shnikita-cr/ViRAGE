node_lines:
  - node_line_name: retrieve_node_line
    nodes:
      - node_type: lexical_retrieval
        strategy:
          metrics: [retrieval_f1, retrieval_recall, retrieval_precision, retrieval_ndcg, retrieval_mrr, retrieval_map]
          speed_threshold: 10
        top_k: 5
        modules:
          - module_type: bm25
            bm25_tokenizer: porter_stemmer
      - node_type: semantic_retrieval
        strategy:
          metrics: [retrieval_f1, retrieval_recall, retrieval_precision, retrieval_ndcg, retrieval_mrr, retrieval_map]
          speed_threshold: 30
        top_k: 5
        modules:
          - module_type: vectordb
            vectordb: default
      - node_type: hybrid_retrieval
        strategy:
          metrics: [retrieval_f1, retrieval_recall, retrieval_precision, retrieval_ndcg, retrieval_mrr, retrieval_map]
          speed_threshold: 30
        top_k: 5
        modules:
          - module_type: hybrid_rrf
            weight_range: (4, 80)
