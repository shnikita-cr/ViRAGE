mode = "streamlit"

[settings]
artifact_root = "./artifacts"
visrag_corpus_root = "./data/visrag_corpora"
visrag_index_root = "./artifacts/visrag_index"
visrag_force_rebuild_index = false
visrag_top_k_examples = 5
visrag_top_k_recommendations = 3
visrag_retriever_fetch_k = 20
visrag_similarity_threshold = 0.10
visrag_embedding_backend = "ollama"
visrag_embedding_model = "embeddinggemma"
visrag_ollama_base_url = "http://localhost:11434/api"
visrag_ollama_timeout_seconds = 30.0
visrag_enable_llm_synthesis = true
vega_output_format = "png"
enable_scenegraph_check = true
enable_empty_chart_check = true
enable_spec_score = true
enable_vision_score = true
enable_evaluation_summary = true
strict_image_only_analysis = true
streamlit_compute_metrics = false
streamlit_show_step_logs = true

[streamlit]
compute_metrics = false
show_step_logs = true

[reasoning_model]
provider = "openai"
model = "gpt-4.1-mini"
temperature = 0.0
base_url = "http://localhost:11434"
timeout_seconds = 60.0

[spec_model]
provider = "openai"
model = "gpt-4.1-mini"
temperature = 0.0
base_url = "http://localhost:11434"
timeout_seconds = 60.0

[vlm_model]
provider = "openai"
model = "gpt-4.1-mini"
temperature = 0.0
timeout_seconds = 60.0

[vision_judge_model]
provider = "openai"
model = "gpt-4.1-mini"
temperature = 0.0
timeout_seconds = 60.0
